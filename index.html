<body>
<main class="app">
  <header class="topbar"><div class="brand" id="brandTitle">MRI 磁共振模拟体验</div></header>

  <section class="view" id="selectView">
    <h1 class="page-title">您要做哪项 MRI 磁共振检查？</h1>
    <p class="select-note">本页面仅做参考，实际请以医院通知为准。</p>
    <div class="exam-grid" id="examGrid"></div>
  </section>

  <section class="view" id="detailView" hidden>
    <button class="back-btn" id="detailBack">← 返回上一步</button>
    <div style="height:14px"></div>
    <h1 class="page-title">MRI 检查介绍</h1>
    <p class="lead">以下内容介绍通用 MRI 检查环境与基本流程，不针对具体检查部位。</p>
    <div class="video-wrap" id="videoWrap"></div>
    <div class="video-fallback" id="videoFallback"><span>视频无法播放时，可在原发布平台观看。</span><a class="source-link" id="videoLink" target="_blank" rel="noopener">前往原平台观看 →</a></div>
    <div class="section"><h2>通用检查流程</h2><ol class="steps" id="stepList"></ol></div>
    <div class="notice"><strong>请提前知道：</strong>实际检查时通常不会逐阶段播报。长时间没有提示通常不代表异常，请保持不动并耐心等待。</div>
    <div class="actions"><button class="primary" id="detailStart">开始模拟体验</button><button class="secondary" id="detailChoose">选择其他检查</button></div>
  </section>

  <section class="view" id="simView" hidden>
    <button class="back-btn sim-back-link" id="simBack">← 返回上一步</button>
    <div class="sim-head"><span class="actual-chip" id="actualChip"></span><button class="sim-video-btn" id="watchVideo">了解MRI检查</button></div>
    <div class="experience-settings">
      <div class="settings-toolbar">
        <div class="prompt-setting"><div class="prompt-copy"><label class="voice-control voice-toggle" for="voiceToggle" aria-label="开启或关闭阶段说明语音"><strong class="voice-label">语音播报</strong><input id="voiceToggle" type="checkbox" checked><i class="voice-switch" aria-hidden="true"></i></label></div></div>
        <div class="sound-summary"><div class="sound-summary-copy"><span>音效：</span><strong id="currentSoundMode">原声（较响）</strong></div><button class="sound-edit-btn" id="reselectSound" aria-expanded="false" aria-controls="inlineSoundOptions">更换音效</button></div>
      </div>
      <p class="prompt-note">仅用于模拟体验；真实检查进入扫描舱后通常没有逐阶段语音提示。</p>
      <div class="inline-sound-options" id="inlineSoundOptions" hidden aria-label="选择模拟音效">
        <button class="sound-choice active" data-sound-choice="normal" aria-pressed="true"><strong>原声</strong><small>较响</small></button>
        <button class="sound-choice" data-sound-choice="cotton" aria-pressed="false"><strong>棉花</strong><small>稍小</small></button>
        <button class="sound-choice" data-sound-choice="earplugs" aria-pressed="false"><strong>耳塞</strong><small>更小</small></button>
      </div>
    </div>
    <div class="status"><button class="stage-reset" id="resetRunning" hidden>重置</button>
      <div class="status-main"><div class="status-summary" id="statusSummary" hidden><div class="status-heading"><div class="status-phase" id="statusPhase" hidden></div><div class="phase-state" id="phaseState" hidden></div></div></div><div class="status-action"><button class="start-btn" id="startBtn">▶ 立即体验</button><button class="status-reset" id="statusReset" hidden>↻ 重新体验</button></div></div>
      <div class="progress-row" id="progressRow"><div class="progress-track-wrap" id="progressTrackWrap"><div class="progress-segments" id="progressSegments" role="progressbar" aria-label="进度" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0"></div></div><span class="progress-count" id="progressCount">进度 0/7</span></div>
      <div class="speech-caption" id="speechCaption" role="status" aria-live="polite" hidden></div>
    </div>
    <div class="timeline"><div class="timeline-head"><h2>体验与实际过程对照</h2><div class="timeline-meta"><span>具体以医院安排为准</span></div></div><div id="processComparisonList"></div><div class="timeline-total"><span id="processTotalTime">耗时总计</span></div></div>
  </section>
</main>

<script>
const DEFAULT_VIDEO = {
  embed:'https://player.bilibili.com/player.html?bvid=BV1oVL46GEVY&page=1&high_quality=1',
  url:'https://www.bilibili.com/video/BV1oVL46GEVY/',
  source:'国内科普视频，浙大一院良渚分院协助拍摄'
};

function buildSequences(type){
  const special = {
    cardiac:['配合短暂屏气','继续保持不动'], abdomen:['配合短暂屏气','继续平稳呼吸'],
    pelvis:['保持身体不动','继续平稳呼吸'], breast:['俯卧保持不动','继续平稳呼吸'],
    cervical:['保持头颈不动','尽量避免吞咽'], lumbar:['保持腰部不动','继续平稳呼吸'],
    'whole-spine':['完成第一段扫描','继续保持全身不动'], brain:['保持头部不动','继续平稳呼吸'],
    general:['保持身体不动','继续平稳呼吸']
  }[type];
  return [
    {id:'quiet',name:'准备进入扫描舱',duration:8,announce:'检查床会缓慢移动，请放松身体。'},
    {id:'hum',name:'确认扫描位置',duration:12,announce:'会先确认检查位置，请保持不动。'},
    {id:'knock',name:'第一组扫描声音',duration:18,announce:'接下来会听到有节奏的敲击声。'},
    {id:'alternate',name:special[0],duration:20,announce:`接下来请${special[0]}。`},
    {id:'loud',name:'较响的一组声音',duration:18,announce:'接下来的声音会比较响，这是机器正常工作的声音。'},
    {id:'rapid',name:special[1],duration:14,announce:`最后一组，请${special[1]}。`},
    {id:'done',name:'体验完成',duration:3,announce:'模拟体验完成，可以放松身体了。'}
  ];
}

const EXAMS = [
  {id:'brain',title:'头部 MRI',actualTime:'约 30–60 分钟',position:'头部通常先进舱，头部会放入专用线圈。',organ:'brain',steps:['取下金属物品，完成安全确认','仰卧躺下，戴好听力保护用品','头部放入专用线圈并适当固定','检查床缓慢进入扫描舱','听到多组扫描声音并保持头部不动','检查结束后离开扫描舱'],processMap:{prepare:[0,1,2],enter:[3],scan:[4],finish:[5]},sequences:buildSequences('brain')},
  {id:'cardiac',title:'心脏 MRI',actualTime:'约 45–90 分钟',position:'通常仰卧，心脏位于扫描舱中心。',organ:'heart',steps:['按医院要求做好饮食和用药准备','取下金属物品并完成安全确认','胸前可能粘贴心电电极并放置线圈','检查床进入扫描舱','按提示进行多次短暂屏气','部分检查可能注射造影剂后继续扫描'],processMap:{prepare:[0,1,2],enter:[3],scan:[4,5],finish:[5]},sequences:buildSequences('cardiac')},
  {id:'breast',title:'乳腺 MRI',actualTime:'约 30–60 分钟',position:'通常俯卧在乳腺专用线圈上。',organ:'breast',steps:['确认是否需要造影剂及相关准备','取下金属物品并更换检查服','俯卧在专用检查床上调整位置','检查床进入扫描舱','保持身体和胸部不动','完成扫描，按医护人员提示起身'],processMap:{prepare:[0,1,2],enter:[3],scan:[4],finish:[5]},sequences:buildSequences('breast')},
  {id:'abdomen',title:'腹部 MRI',actualTime:'约 30–60 分钟',position:'通常仰卧，扫描中可能需要多次屏气。',organ:'abdomen',steps:['按医院通知确认是否需要空腹','取下金属物品并完成安全确认','仰卧躺下，腹部放置线圈','检查床进入扫描舱','听到提示时进行短暂屏气','部分检查可能使用药物或造影剂'],processMap:{prepare:[0,1,2],enter:[3],scan:[4,5],finish:[5]},sequences:buildSequences('abdomen')},
  {id:'pelvis',title:'盆腔 MRI',actualTime:'约 30–60 分钟',position:'通常仰卧，盆腔位于扫描舱中心。',organ:'pelvis',steps:['按医院通知确认饮水、憋尿或用药要求','取下金属物品并完成安全确认','仰卧躺下并调整检查位置','检查床进入扫描舱','保持骨盆和双腿不动','部分检查可能注射造影剂后继续扫描'],processMap:{prepare:[0,1,2],enter:[3],scan:[4,5],finish:[5]},sequences:buildSequences('pelvis')},
  {id:'cervical',title:'颈椎 MRI',actualTime:'约 20–40 分钟',position:'头颈部通常先进舱，并使用头颈线圈。',organ:'cervical',steps:['取下金属物品并完成安全确认','仰卧躺下，头颈部放入线圈','使用软垫帮助保持颈部稳定','检查床进入扫描舱','保持头颈不动并尽量避免吞咽','扫描结束后按提示起身'],processMap:{prepare:[0,1,2],enter:[3],scan:[4],finish:[5]},sequences:buildSequences('cervical')},
  {id:'lumbar',title:'腰椎 MRI',actualTime:'约 20–40 分钟',position:'通常仰卧，腰椎位于扫描舱中心。',organ:'lumbar',steps:['取下金属物品并完成安全确认','仰卧躺下并垫好腰腿','调整位置，使腰椎位于扫描中心','检查床进入扫描舱','保持腰背和双腿不动','扫描结束后缓慢起身'],processMap:{prepare:[0,1,2],enter:[3],scan:[4],finish:[5]},sequences:buildSequences('lumbar')},
  {id:'whole-spine',title:'全脊柱 MRI',actualTime:'约 45–90 分钟',position:'通常仰卧，需要分多组完成较大范围扫描。',organ:'spine',steps:['取下金属物品并完成安全确认','仰卧躺下，调整头颈和身体位置','检查床进入扫描舱','按不同脊柱区域分组扫描','过程中可能移动检查床重新定位','全部扫描结束后按提示起身'],processMap:{prepare:[0,1],enter:[2],scan:[3,4],finish:[5]},sequences:buildSequences('whole-spine')},
  {id:'general',title:'其他 MRI 检查',hint:'不知道选哪个，就选这里',actualTime:'约 20–60 分钟',position:'不同部位的摆位会有差异，这里先了解共同的进舱和扫描过程。',organ:'general',steps:['取下金属物品，完成安全确认','按医护人员安排躺好并戴好听力保护用品','医护人员帮助调整检查部位和线圈','检查床缓慢进入扫描舱','听到多组扫描声音并保持身体不动','检查结束后按提示离开扫描舱'],processMap:{prepare:[0,1,2],enter:[3],scan:[4],finish:[5]},sequences:buildSequences('general')}
];

const $=id=>document.getElementById(id);
let selected=EXAMS[0];
let activeUtterance=null;
let pendingSpeechFinish=null;
let voiceEnabled=true;
let state={running:false,finished:false,index:0,elapsed:0,stageElapsed:0,timer:null,timerFallback:null,announcing:false,token:0};

function bodyIllustration(organ,title){
  const marks={
    general:'<path d="M45 43c6-7 40-7 46 0l9 49c2 10-6 16-16 16H52c-10 0-18-6-16-16Z" fill="none" stroke="#4b85c8" stroke-width="3" stroke-dasharray="5 4"/>',
    brain:'<path d="M48 29c0-11 9-19 20-19s20 8 20 19c0 9-5 14-12 18H59c-7-4-11-10-11-18Z" fill="#ef8b88"/><path d="M59 18c-6 5-6 15 0 20M69 13c-4 7-3 19 2 30M79 17c5 6 4 15-1 22" fill="none" stroke="#fff" stroke-width="2"/>',
    heart:'<path d="M68 48c-15-14-28 7-17 18l17 17 17-17c11-11-2-32-17-18Z" fill="#d95c63"/><path d="M66 48c-2-9 1-16 8-21M74 49c7-5 10-10 10-17" fill="none" stroke="#a23b48" stroke-width="4"/>',
    breast:'<path d="M48 49c9-7 17-4 20 6 3-10 11-13 20-6v23H48Z" fill="#ef9aa0"/><circle cx="58" cy="59" r="3" fill="#b95261"/><circle cx="78" cy="59" r="3" fill="#b95261"/>',
    abdomen:'<ellipse cx="68" cy="69" rx="23" ry="20" fill="#e7a35a"/><path d="M53 67c9-8 21-8 31 0M56 76c8-5 17-5 25 0" fill="none" stroke="#fff" stroke-width="3"/>',
    pelvis:'<path d="M45 76c8-9 38-9 46 0l-8 20H53Z" fill="#8e7ac4"/><path d="M58 76l10 15 10-15" fill="none" stroke="#fff" stroke-width="3"/>',
    cervical:'<path d="M67 34v31" stroke="#df765f" stroke-width="8" stroke-linecap="round"/><circle cx="67" cy="38" r="3" fill="#fff"/><circle cx="67" cy="47" r="3" fill="#fff"/><circle cx="67" cy="56" r="3" fill="#fff"/>',
    lumbar:'<path d="M67 67v32" stroke="#df765f" stroke-width="9" stroke-linecap="round"/><circle cx="67" cy="72" r="3" fill="#fff"/><circle cx="67" cy="82" r="3" fill="#fff"/><circle cx="67" cy="92" r="3" fill="#fff"/>',
    spine:'<path d="M67 34v67" stroke="#df765f" stroke-width="8" stroke-linecap="round"/><path d="M67 38c-7 9 7 13 0 22s7 13 0 22 7 12 0 18" fill="none" stroke="#fff" stroke-width="2"/>'
  };
  return `<svg viewBox="0 0 136 116" role="img" aria-label="${title}部位示意图"><title>${title}部位示意图</title><circle cx="68" cy="23" r="15" fill="#bad0e5"/><path d="M48 42c7-5 33-5 40 0l11 49c2 9-5 15-14 15H51c-9 0-16-6-14-15Z" fill="#dbe7f1"/><path d="M48 48 30 83M88 48l18 35" stroke="#bad0e5" stroke-width="10" stroke-linecap="round"/>${marks[organ]}</svg>`;
}

function renderGrid(){
  $('examGrid').innerHTML=EXAMS.map(exam=>`<button class="exam-card" data-exam="${exam.id}"><span class="exam-art">${bodyIllustration(exam.organ,exam.title)}</span><span class="exam-name">${exam.title}</span><span class="exam-time">${exam.hint?`${exam.hint}<br>`:''}${exam.actualTime}</span></button>`).join('');
  document.querySelectorAll('[data-exam]').forEach(btn=>btn.addEventListener('click',()=>{selected
